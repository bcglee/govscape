defaults:
      run:
        shell: bash -el {0}

name: CI
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.11.14']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/bcglee/govscape-base:py${{ matrix.python }}-lucene10.0.0-poetry2.3.2
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Install packages
        run: |
          export PATH=$PATH:/opt/poetry/bin
          poetry install
      - name: Run tests
        run: |
          export PATH=$PATH:/opt/poetry/bin
          poetry run pytest tests
      - uses: codecov/codecov-action@v5

  benchmarks:
    name: CodSpeed Benchmarks
    runs-on: ubuntu-latest
    # These benchmarks run the real ST/CLIP embedding models over the full
    # ~1,660-page sample corpus (see tests/benchmarks/conftest.py) and took
    # ~10 minutes on a 16-core machine; CI runners typically have fewer
    # cores, so allow generous headroom before treating the job as hung.
    timeout-minutes: 60
    # Deliberately NOT run inside the govscape-base container (unlike the
    # `test` job): CodSpeed's `walltime` instrument needs to adjust a
    # host-level kernel sysctl (kernel.kptr_restrict), which a Docker
    # container job can't do even running as root, causing
    # "sysctl: permission denied" / "Failed to execute command with sudo"
    # failures. This is safe because tests/benchmarks never touches
    # govscape.indexing/pylucene (the only reason the other job needs the
    # custom image), so a plain Python + Poetry setup is sufficient.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Install Poetry
        run: pipx install poetry==2.3.2
      - name: Install packages
        run: poetry install
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          # The benchmarked PDF-processing stages do real file I/O and spawn
          # worker processes, which CPU simulation can't instrument well;
          # `walltime` measures real elapsed time instead (see
          # `tests/benchmarks/test_pdf_processing_benchmarks.py`).
          mode: walltime
          run: poetry run pytest tests/benchmarks --codspeed

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
